<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Oficial - Musguito</title>
    
    <link rel="icon" type="image/png" href="Musguito.png">

    <style>
        :root {
            --lima: #bef264;
            --lima-dark: #a3e635;
            --negro: #0f172a;
            --gris-suave: #f8fafc;
            --transicion: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #ffffff;
            color: var(--negro);
            overflow-x: hidden;
            line-height: 1.5;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        nav {
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            width: 100%;
            top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--negro);
            font-weight: 800;
            font-size: 1.2rem;
        }

        .brand img {
            height: 35px;
            width: auto;
            border-radius: 6px;
        }

        .shop-container {
            padding: 140px 1.5rem 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-height: 100vh;
        }

        .badge {
            background-color: var(--lima);
            color: var(--negro);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            animation: fadeInUp 0.6s ease-out;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            margin-bottom: 10px;
            animation: fadeInUp 0.8s ease-out;
        }

        h1 span {
            background: linear-gradient(90deg, var(--negro), var(--lima-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #64748b;
            font-size: 1.1rem;
            margin-bottom: 40px;
            animation: fadeInUp 1s ease-out;
        }

        .store-wrapper {
            width: 98%;
            max-width: 1200px; 
            animation: fadeInUp 1.2s ease-out;
            background: var(--gris-suave);
            padding: 15px;
            border-radius: 32px;
            border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.05);
        }

        @media (min-width: 768px) {
            h1 { font-size: 4.5rem; }
            .store-wrapper { padding: 30px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="brand">
            <img src="Musguito.png" alt="Musguito">
            <span>Musguito</span>
        </a>
    </nav>

    <main class="shop-container">
        <div class="badge">Merch Oficial</div>
        <h1>Equ&iacute;pate con el <span>Musgo.</span></h1>
        <p class="tagline">Explora la colecci&oacute;n exclusiva de Musguito.</p>
        
        <div class="store-wrapper">
            <iframe 
                style="border-radius:24px; border:none; display: block;" 
                src="https://embed.creator-spring.com/widget?slug=musguito&per=30&currency=&page=1&layout=carousel-small&theme=light" 
                title="Musguito Merch store powered by Spring" 
                width="100%" 
                height="520" 
                data-reactroot="">
            </iframe>
        </div>
    </main>

</body>
</html>
